apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: bizcopilot
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ollama-pvc
  namespace: bizcopilot
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Gi   # Llama3 model ~4.7GB
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vector-pvc
  namespace: bizcopilot
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi