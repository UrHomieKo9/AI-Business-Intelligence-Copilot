apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: bizcopilot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          env:
            - name: POSTGRES_DB
              value: bizcopilot
            - name: POSTGRES_USER
              value: bizcopilot
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bizcopilot-secrets
                  key: POSTGRES_PASSWORD
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "bizcopilot"]
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-svc
  namespace: bizcopilot
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432